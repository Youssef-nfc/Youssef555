<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CODE⚡LAB PRO</title>

<style>
:root {
    --bg-color: #030305;
    --card-bg: #0d0d12;
    --border-color: #22222d;
    --gold: #f0c400;
    --gold-glow: rgba(240, 196, 0, 0.35);
    --text-main: #ffffff;
    --text-muted: #888895;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg-color);
    color:var(--text-main);
    min-height:100vh;
    overflow-x:hidden;
    transition: background 0.3s;
}

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:70px;
    background:rgba(3, 3, 5, 0.85);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border-color);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    z-index:1000;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:3px;
    color:var(--gold);
    text-shadow: 0 0 15px var(--gold-glow);
}

.menuBtn{
    width:46px;
    height:46px;
    border:1px solid var(--border-color);
    background:#121218;
    color:var(--gold);
    border-radius:14px;
    font-size:22px;
    cursor:pointer;
    transition: 0.3s;
}

.menuBtn:active {
    transform: scale(0.9);
}

.menu{
    position:fixed;
    top:70px;
    left:0;
    right:0;
    background:rgba(10, 10, 15, 0.95);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border-color);
    padding:15px;
    transform:translateY(-120%);
    transition: transform 0.4s cubic-bezier(0.1, 1, 0.1, 1);
    z-index:999;
    border-radius: 0 0 25px 25px;
}

.menu.open{
    transform:translateY(0);
}

.menu button{
    width:100%;
    background:#14141c;
    color:var(--text-main);
    border:1px solid var(--border-color);
    margin:6px 0;
    padding:16px;
    border-radius:15px;
    text-align:left;
    font-size:16px;
    font-weight: 600;
    cursor:pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
}

.menu button:hover, .menu button:active{
    background:#1c1c28;
    border-color: var(--gold);
    color: var(--gold);
}

main{
    padding:95px 16px 40px;
    max-width:600px;
    margin:auto;
}

.page{
    display:none;
    animation:show .4s cubic-bezier(0.1, 1, 0.1, 1);
}

.page.active{
    display:block;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hero{
    text-align:center;
    margin-bottom:24px;
}

.hero h1{
    font-size:30px;
    margin-bottom:6px;
    font-weight: 800;
}

.hero p{
    color:var(--text-muted);
    font-size: 14px;
}

/* SNAKE */
.gameBox{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:28px;
    padding:16px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

canvas{
    display:block;
    width:100%;
    aspect-ratio:1;
    background: var(--gold);
    border-radius:20px;
    border: 1px solid var(--border-color);
    touch-action: none;
}

.gameInfo{
    display:flex;
    justify-content:space-between;
    padding:16px 10px;
    color:var(--text-muted);
    font-size: 15px;
}

.gameInfo strong{
    color:var(--gold);
}

.start{
    width:100%;
    border:0;
    padding:16px;
    border-radius:16px;
    background:var(--gold);
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor: pointer;
    transition: 0.2s;
}

.start:active {
    transform: scale(0.97);
}

.controls{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:15px;
}

.controls button{
    height:60px;
    border:1px solid var(--border-color);
    background:#14141c;
    color:var(--gold);
    border-radius:16px;
    font-size:24px;
    cursor: pointer;
    transition: 0.15s;
}

.controls button:active {
    background: #1f1f2e;
}

.controls .empty{
    visibility:hidden;
}

/* CALCULATOR */
.calc{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:28px;
    padding:20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

.display{
    min-height:110px;
    background:#020204;
    border: 1px solid var(--border-color);
    border-radius:20px;
    padding:18px;
    text-align:right;
    margin-bottom:16px;
}

.expression{
    color:var(--text-muted);
    min-height:25px;
    font-size: 16px;
    word-break: break-all;
}

.result{
    font-size:38px;
    font-weight:bold;
    margin-top:8px;
    color: var(--gold);
    word-break: break-all;
}

.keys{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.keys button{
    height:62px;
    border:1px solid var(--border-color);
    border-radius:16px;
    background:#14141c;
    color:white;
    font-size:20px;
    cursor: pointer;
    transition: 0.15s;
}

.keys button:active{
    transform:scale(.92);
    background:#20202e;
}

.keys .operator{
    background:#1f1f2e!important;
    color:var(--gold)!important;
    font-weight: bold;
}

.keys .equal {
    background:var(--gold)!important;
    color:#000!important;
    font-weight: bold;
}

.keys .clear{
    background:#331212!important;
    color:#ff5555!important;
}

/* FLASHLIGHT */
.flashBox{
    background:var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius:30px;
    padding:35px 20px;
    text-align:center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    transition: 0.3s;
}

body.screen-flash-active {
    background: #ffffff !important;
}
body.screen-flash-active header {
    background: rgba(255, 255, 255, 0.95) !important;
    border-bottom-color: #ddd !important;
}
body.screen-flash-active .flashBox {
    background: #ffffff !important;
    border-color: #ccc !important;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.2);
}
body.screen-flash-active .flashBox h2, 
body.screen-flash-active #flashStatus,
body.screen-flash-active .hero h1,
body.screen-flash-active .hero p {
    color: #000000 !important;
}

.flashBox h2 {
    letter-spacing: 2px;
    margin-bottom: 5px;
}

#flashStatus {
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 10px;
}

.flashCircle{
    width:190px;
    height:190px;
    border-radius:50%;
    background:#14141c;
    border: 2px solid var(--border-color);
    margin:30px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.4s;
}

.flashIcon{
    font-size:65px;
    transition: 0.4s;
}

.flashCircle.on{
    background:#ffffff;
    border-color: #ffcc00;
    box-shadow: 0 0 50px #ffffff, inset 0 0 25px rgba(255,255,255,0.8);
}

.flashButtons{
    display:flex;
    gap:12px;
}

.flashButtons button{
    flex:1;
    height:56px;
    border:0;
    border-radius:18px;
    font-weight:bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.onBtn{
    background:var(--gold);
    color: #000;
}

.offBtn{
    background:#14141c;
    color:white;
    border: 1px solid var(--border-color) !important;
}

/* RECORDER */
.recorder{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:28px;
    padding:16px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

video{
    width:100%;
    background:#000;
    border-radius:20px;
    display:block;
    aspect-ratio:16/10;
    object-fit:cover;
    border: 1px solid var(--border-color);
    margin-bottom: 14px;
}

.recordControls{
    display:flex;
    gap:10px;
}

.recordControls button{
    flex:1;
    padding:15px;
    border:0;
    border-radius:16px;
    font-weight:bold;
    cursor: pointer;
    transition: 0.2s;
}

.recordBtn{
    background:#b81c1c;
    color:white;
}

.stopBtn{
    background:#22222d;
    color:white;
    border: 1px solid var(--border-color);
}

/* Action panel بعد التسجيل (حفظ أو حذف) */
.postRecordActions {
    display: none;
    gap: 10px;
    margin-top: 14px;
}

.postRecordActions button {
    flex: 1;
    padding: 15px;
    border-radius: 16px;
    font-weight: bold;
    cursor: pointer;
    border: 0;
}

.saveVideoBtn {
    background: var(--gold);
    color: #000;
}

.deleteVideoBtn {
    background: #331212;
    color: #ff5555;
    border: 1px solid #552222 !important;
}

.status{
    text-align:center;
    color:var(--text-muted);
    margin-top:14px;
    font-size:13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">CODE⚡LAB</div>
    <button class="menuBtn" onclick="toggleMenu()">☰</button>
</header>

<div class="menu" id="menu">
    <button onclick="openPage('snake')">🐍 Snake Game</button>
    <button onclick="openPage('calculator')">🧮 Calculator</button>
    <button onclick="openPage('flashlight')">🔦 Flashlight</button>
    <button onclick="openPage('recorder')">🎥 Screen Recorder</button>
</div>

<main>

<!-- ================= SNAKE ================= -->
<section id="snake" class="page active">
    <div class="hero">
        <h1>🐍 SNAKE</h1>
        <p>Eat the apples. Break the record.</p>
    </div>
    <div class="gameBox">
        <canvas id="game" width="400" height="400"></canvas>
        <div class="gameInfo">
            <span>SCORE: <strong id="score">0</strong></span>
            <span>BEST: <strong id="best">0</strong></span>
        </div>
        <button class="start" onclick="startGame()">START GAME</button>
        <div class="controls">
            <button class="empty">.</button>
            <button onclick="changeDirection('up')">↑</button>
            <button class="empty">.</button>
            <button onclick="changeDirection('left')">←</button>
            <button onclick="changeDirection('down')">↓</button>
            <button onclick="changeDirection('right')">→</button>
        </div>
    </div>
</section>

<!-- ================= CALCULATOR ================= -->
<section id="calculator" class="page">
    <div class="hero">
        <h1>🧮 CALCULATOR</h1>
        <p>Simple. Fast. Powerful.</p>
    </div>
    <div class="calc">
        <div class="display">
            <div class="expression" id="expression">0</div>
            <div class="result" id="result">0</div>
        </div>
        <div class="keys">
            <button class="clear" onclick="clearCalc()">C</button>
            <button class="operator" onclick="addCalc('/')">÷</button>
            <button class="operator" onclick="addCalc('*')">×</button>
            <button class="operator" onclick="addCalc('-')">−</button>

            <button onclick="addCalc('7')">7</button>
            <button onclick="addCalc('8')">8</button>
            <button onclick="addCalc('9')">9</button>
            <button class="operator" onclick="addCalc('+')">+</button>

            <button onclick="addCalc('4')">4</button>
            <button onclick="addCalc('5')">5</button>
            <button onclick="addCalc('6')">6</button>
            <button onclick="addCalc('.')">.</button>

            <button onclick="addCalc('1')">1</button>
            <button onclick="addCalc('2')">2</button>
            <button onclick="addCalc('3')">3</button>
            <button class="equal" onclick="calculate()">=</button>

            <button onclick="addCalc('0')" style="grid-column:span 4">0</button>
        </div>
    </div>
</section>

<!-- ================= FLASHLIGHT ================= -->
<section id="flashlight" class="page">
    <div class="hero">
        <h1>🔦 FLASHLIGHT</h1>
        <p>Light simulation interface.</p>
    </div>
    <div class="flashBox" id="flashBoxContainer">
        <h2>FLASHLIGHT</h2>
        <div id="flashStatus">OFF</div>
        <div class="flashCircle" id="flashCircle">
            <div class="flashIcon">🔦</div>
        </div>
        <div class="flashButtons">
            <button class="onBtn" onclick="flashOn()">ON</button>
            <button class="offBtn" onclick="flashOff()">OFF</button>
        </div>
    </div>
</section>

<!-- ================= RECORDER ================= -->
<section id="recorder" class="page">
    <div class="hero">
        <h1>🎥 SCREEN RECORDER</h1>
        <p>Record your phone screen for Reels & Ads.</p>
    </div>
    <div class="recorder">
        <video id="videoPreview" autoplay playsinline controls></video>
        
        <div class="recordControls" id="mainRecordControls">
            <button class="recordBtn" onclick="startScreenRecording()">● START REC</button>
            <button class="stopBtn" onclick="stopScreenRecording()">■ STOP</button>
        </div>

        <div class="postRecordActions" id="postRecordActions">
            <button class="saveVideoBtn" onclick="saveVideo()">💾 SAVE VIDEO</button>
            <button class="deleteVideoBtn" onclick="deleteVideo()">🗑️ DELETE</button>
        </div>

        <div class="status" id="recordStatus">Ready to record screen</div>
    </div>
</section>

</main>

<script>
// --- MENU ---
function toggleMenu(){
    document.getElementById("menu").classList.toggle("open");
}

function openPage(id){
    document.querySelectorAll(".page").forEach(page=>{
        page.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
    document.getElementById("menu").classList.remove("open");
}

// --- SNAKE GAME ---
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const grid = 25;

let snake = [{x:200,y:200}, {x:175,y:200}, {x:150,y:200}];
let apple = {x:100, y:100};
let dx = grid, dy = 0;
let score = 0, gameRunning = false, gameTimer;
let best = Number(localStorage.getItem("snakeBest") || 0);
document.getElementById("best").innerText = best;

function randomApple(){
    apple.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
    apple.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
}

function startGame(){
    snake = [{x:200,y:200}, {x:175,y:200}, {x:150,y:200}];
    dx = grid; dy = 0; score = 0;
    document.getElementById("score").innerText = 0;
    randomApple();
    gameRunning = true;
    clearInterval(gameTimer);
    gameTimer = setInterval(gameLoop, 120);
}

function gameLoop(){
    if(!gameRunning) return;
    const head = {x:snake[0].x + dx, y:snake[0].y + dy};

    if(head.x >= canvas.width) head.x = 0;
    if(head.x < 0) head.x = canvas.width - grid;
    if(head.y >= canvas.height) head.y = 0;
    if(head.y < 0) head.y = canvas.height - grid;

    for(let i=1; i<snake.length; i++){
        if(head.x === snake[i].x && head.y === snake[i].y){
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if(head.x === apple.x && head.y === apple.y){
        score++;
        document.getElementById("score").innerText = score;
        if(score > best){
            best = score;
            localStorage.setItem("snakeBest", best);
            document.getElementById("best").innerText = best;
        }
        randomApple();
    } else {
        snake.pop();
    }
    drawGame();
}

function drawGame(){
    ctx.fillStyle = "#f0c400";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 0.5;
    for(let x=0; x<canvas.width; x+=grid){
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
    }
    for(let y=0; y<canvas.height; y+=grid){
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
    }

    ctx.font = "22px Arial";
    ctx.fillText("🍎", apple.x + 2, apple.y + 20);

    snake.forEach((part, index)=>{
        ctx.fillStyle = index === 0 ? "#111111" : "#333333";
        ctx.fillRect(part.x + 2, part.y + 2, grid - 4, grid - 4);
    });
}

function gameOver(){
    gameRunning = false;
    clearInterval(gameTimer);
    alert("GAME OVER!\nScore: " + score);
}

function changeDirection(direction){
    if(direction === "up" && dy === 0){ dx = 0; dy = -grid; }
    if(direction === "down" && dy === 0){ dx = 0; dy = grid; }
    if(direction === "left" && dx === 0){ dx = -grid; dy = 0; }
    if(direction === "right" && dx === 0){ dx = grid; dy = 0; }
}

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
}, {passive: false});

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
}, {passive: false});

canvas.addEventListener('touchend', e => {
    if (!touchStartX || !touchStartY) return;

    let touchEndX = e.changedTouches[0].clientX;
    let touchEndY = e.changedTouches[0].clientY;

    let diffX = touchEndX - touchStartX;
    let diffY = touchEndY - touchStartY;

    if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) {
            changeDirection('right');
        } else if (diffX < -30) {
            changeDirection('left');
        }
    } else {
        if (diffY > 30) {
            changeDirection('down');
        } else if (diffY < -30) {
            changeDirection('up');
        }
    }

    touchStartX = 0;
    touchStartY = 0;
    e.preventDefault();
}, {passive: false});

document.addEventListener("keydown", e=>{
    if(e.key === "ArrowUp") changeDirection("up");
    if(e.key === "ArrowDown") changeDirection("down");
    if(e.key === "ArrowLeft") changeDirection("left");
    if(e.key === "ArrowRight") changeDirection("right");
});

drawGame();

// --- CALCULATOR ---
let calc = "";
function addCalc(value){
    calc += value;
    document.getElementById("expression").innerText = calc;
}

function clearCalc(){
    calc = "";
    document.getElementById("expression").innerText = "0";
    document.getElementById("result").innerText = "0";
}

function calculate(){
    if(!calc) return;
    try{
        let sanitized = calc.replace(/×/g, '*').replace(/÷/g, '/');
        const answer = Function('"use strict";return (' + sanitized + ')')();
        
        if(isNaN(answer) || !isFinite(answer)){
            document.getElementById("result").innerText = "ERROR";
        } else {
            document.getElementById("result").innerText = Number(answer.toFixed(6));
        }
    } catch{
        document.getElementById("result").innerText = "ERROR";
    }
}

// --- FLASHLIGHT ---
function flashOn(){
    document.getElementById("flashCircle").classList.add("on");
    document.getElementById("flashStatus").innerText = "ON 💡";
    document.body.classList.add("screen-flash-active");
}

function flashOff(){
    document.getElementById("flashCircle").classList.remove("on");
    document.getElementById("flashStatus").innerText = "OFF";
    document.body.classList.remove("screen-flash-active");
}

// --- SCREEN RECORDER FOR REELS & ADS ---
let screenStream = null;
let screenRecorder = null;
let recordedChunks = [];
let recordedBlobUrl = null;

async function startScreenRecording(){
    try {
        // طلب تصوير الشاشة (Screen Capture API)
        screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: { mediaSource: "screen" },
            audio: true
        });

        recordedChunks = [];
        screenRecorder = new MediaRecorder(screenStream, { mimeType: 'video/webm; codecs=vp9' });

        screenRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
                recordedChunks.push(e.data);
            }
        };

        screenRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: "video/webm" });
            recordedBlobUrl = URL.createObjectURL(blob);
            
            // عرض الفيديو في المداومة لمعاينته
            const videoPreview = document.getElementById("videoPreview");
            videoPreview.src = recordedBlobUrl;
            videoPreview.controls = true;

            // تبديل الأزرار لإظهار خيارات الحفظ أو الحذف
            document.getElementById("mainRecordControls").style.display = "none";
            document.getElementById("postRecordActions").style.display = "flex";
            document.getElementById("recordStatus").innerText = "Recording finished! Choose to save or delete.";
        };

        // إذا قام المستخدم بإيقاف المشاركة من النظام (الشريط العلوي للهاتف)
        screenStream.getVideoTracks()[0].onended = () => {
            stopScreenRecording();
        };

        screenRecorder.start();
        document.getElementById("recordStatus").innerText = "🔴 Recording screen... You can switch apps now!";
    } catch (err) {
        console.error(err);
        document.getElementById("recordStatus").innerText = "Permission denied or screen recording not supported on this browser.";
    }
}

function stopScreenRecording(){
    if (screenRecorder && screenRecorder.state === "recording") {
        screenRecorder.stop();
    }
    if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
    }
}

function saveVideo(){
    if (!recordedBlobUrl) return;
    const a = document.createElement('a');
    a.href = recordedBlobUrl;
    a.download = 'codelab-reels-ad.webm';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    document.getElementById("recordStatus").innerText = "Video saved successfully! Ready for Instagram Reels.";
    resetRecorderUI();
}

function deleteVideo(){
    recordedBlobUrl = null;
    document.getElementById("videoPreview").src = "";
    document.getElementById("recordStatus").innerText = "Video deleted.";
    resetRecorderUI();
}

function resetRecorderUI(){
    document.getElementById("mainRecordControls").style.display = "flex";
    document.getElementById("postRecordActions").style.display = "none";
}
</script>

</body>
</html>
