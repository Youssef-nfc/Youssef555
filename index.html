<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة القفز الاحترافية بالصوت</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 { font-size: 1.2rem; margin-bottom: 10px; color: #e94560; }

        #game-container {
            position: relative;
            width: 340px;
            height: 350px;
            background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
            border: 3px solid #e94560;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* الشخصية */
        #player {
            position: absolute;
            bottom: 60px;
            left: 30px;
            width: 24px;
            height: 36px;
            background-color: #e94560;
            border-radius: 4px;
            box-shadow: 0 0 10px #e94560;
            transition: bottom 0.2s cubic-bezier(0.25, 1, 0.5, 1), left 0.2s linear, transform 0.1s;
            z-index: 10;
        }

        #player.charging {
            transform: scaleY(0.7); /* ينكمش عند شحن القوة */
            background-color: #ff9f43;
        }

        #player::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 4px;
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
        }

        /* المنصات */
        .platform {
            position: absolute;
            bottom: 0;
            height: 60px;
            background-color: #0f3460;
            border-top: 4px solid #533483;
            border-radius: 4px 4px 0 0;
        }

        /* شريط القوة الشاحنة */
        #charge-bar-container {
            width: 340px;
            height: 14px;
            background-color: #16213e;
            border: 2px solid #0f3460;
            border-radius: 7px;
            margin-top: 15px;
            overflow: hidden;
        }

        #charge-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4ecca3, #ff9f43, #e94560);
            transition: width 0.05s linear;
        }

        #controls { margin-top: 15px; text-align: center; }

        button {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #e94560;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #status { margin-top: 10px; font-size: 0.9rem; color: #4ecca3; }
        #score { position: absolute; top: 10px; right: 15px; font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>

    <h1>لعبة شحن القفزة بالصوت 🎤</h1>

    <div id="game-container">
        <div id="score">النقاط: 0</div>
        <div id="player"></div>
        <div class="platform" id="plat1" style="left: 10px; width: 70px;"></div>
        <div class="platform" id="plat2" style="left: 160px; width: 60px;"></div>
    </div>

    <div id="charge-bar-container">
        <div id="charge-bar"></div>
    </div>

    <div id="controls">
        <button id="start-btn">ابدأ اللعب بالميكروفون</button>
        <p id="status">اضغط على الزر واسمح للميكروفون</p>
    </div>

    <script>
        const player = document.getElementById('player');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');
        const chargeBar = document.getElementById('charge-bar');
        const scoreText = document.getElementById('score');
        const plat1 = document.getElementById('plat1');
        const plat2 = document.getElementById('plat2');

        let audioContext;
        let analyser;
        let microphone;

        let isCharging = false;
        let isJumping = false;
        let chargePower = 0; // القوة المجمعة (0 - 100)
        let playerLeft = 30;
        const baseBottom = 60;
        let score = 0;

        let currentPlat = { left: 10, width: 70 };
        let nextPlat = { left: 160, width: 60 };

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                analyser.fftSize = 256;
                
                statusText.innerText = "تحدث لتجمع القوة.. واسكت باش تنقز!";
                startBtn.style.display = 'none';
                
                listenToVoice();
            } catch (err) {
                statusText.innerText = "خاصك تعطيهم إذن الميكروفون!";
            }
        });

        function listenToVoice() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            function checkAudio() {
                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                let averageVolume = sum / dataArray.length;

                // إذا كان الصوت قوي (أكبر من 20) والشخصية ما كاتنقزش
                if (averageVolume > 20 && !isJumping) {
                    isCharging = true;
                    player.classList.add('charging');
                    
                    // زيادة القوة طالما هناك صوت
                    if (chargePower < 100) {
                        chargePower += 2.5; 
                    }
                    chargeBar.style.width = chargePower + '%';
                } 
                // إذا سكت اللاعب وكانت القوة مجمعة -> ينقز فوراً!
                else if (isCharging && !isJumping) {
                    isCharging = false;
                    player.classList.remove('charging');
                    executeJump(chargePower);
                    chargePower = 0;
                    chargeBar.style.width = '0%';
                }
                
                requestAnimationFrame(checkAudio);
            }
            
            checkAudio();
        }

        function executeJump(power) {
            isJumping = true;
            
            // حساب المسافة على حسب شحال الوقت اللي غوت فيه
            let jumpDistance = (power / 100) * 220; // أقصى مسافة 220px
            let jumpHeight = Math.min((power / 100) * 150 + 40, 160);

            // صعود القفزة
            player.style.bottom = (baseBottom + jumpHeight) + 'px';
            player.style.left = (playerLeft + (jumpDistance / 2)) + 'px';

            // نزول القفزة
            setTimeout(() => {
                playerLeft += jumpDistance;
                player.style.bottom = baseBottom + 'px';
                player.style.left = playerLeft + 'px';

                setTimeout(() => {
                    checkLanding();
                }, 200);
            }, 200);
        }

        function checkLanding() {
            const playerCenter = playerLeft + 12;

            if (playerCenter >= nextPlat.left && playerCenter <= (nextPlat.left + nextPlat.width)) {
                score++;
                scoreText.innerText = "النقاط: " + score;
                statusText.innerText = "قفزة في المحل! واصل!";
                shiftPlatforms();
            } else {
                player.style.bottom = '0px';
                statusText.innerText = "طحتي فالفراغ! حاول تظبط الوقت ديال الصوت.";
                setTimeout(() => {
                    resetGame();
                }, 1500);
            }

            isJumping = false;
        }

        function shiftPlatforms() {
            currentPlat = { ...nextPlat };
            let newLeft = currentPlat.left + currentPlat.width + Math.floor(Math.random() * 70 + 30);
            let newWidth = Math.floor(Math.random() * 30 + 50);

            let offset = currentPlat.left - 10;
            playerLeft -= offset;
            currentPlat.left = 10;
            newLeft -= offset;

            plat1.style.left = currentPlat.left + 'px';
            plat1.style.width = currentPlat.width + 'px';

            plat2.style.left = newLeft + 'px';
            plat2.style.width = newWidth + 'px';

            nextPlat = { left: newLeft, width: newWidth };

            player.style.transition = 'none';
            player.style.left = playerLeft + 'px';
            setTimeout(() => {
                player.style.transition = 'bottom 0.2s cubic-bezier(0.25, 1, 0.5, 1), left 0.2s linear';
            }, 50);
        }

        function resetGame() {
            score = 0;
            scoreText.innerText = "النقاط: 0";
            playerLeft = 30;
            
            currentPlat = { left: 10, width: 70 };
            nextPlat = { left: 160, width: 60 };

            plat1.style.left = '10px';
            plat1.style.width = '70px';
            plat2.style.left = '160px';
            plat2.style.width = '60px';

            player.style.bottom = baseBottom + 'px';
            player.style.left = playerLeft + 'px';
            statusText.innerText = "تكلم باش تبدأ تشحن القفزة!";
            isJumping = false;
        }
    </script>
</body>
</html>
